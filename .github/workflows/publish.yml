name: publish

# Publishes the artifact of one successful build-windows-cuda run as a pre-release on an existing tag.
# Separate from the build so the build job never holds write access; it only re-uploads what that run built,
# after checking the run built exactly the tagged commit and the zip still matches its SHA256SUMS.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-windows-cuda run id'
        required: true
        type: string
      tag:
        description: 'existing tag the run built (e.g. v0.1.43-lp1)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the run and the tag
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id"; exit 1; }
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]{1,63}$ ]] || { echo "bad tag"; exit 1; }
          read -r path concl sha < <(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '"\(.path) \(.conclusion) \(.head_sha)"')
          [ "$path" = ".github/workflows/build-windows-cuda.yml" ] || { echo "run $RUN_ID is $path"; exit 1; }
          [ "$concl" = "success" ] || { echo "run $RUN_ID concluded $concl"; exit 1; }
          tag_sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          [ "$sha" = "$tag_sha" ] || { echo "run built $sha, tag $TAG is $tag_sha"; exit 1; }
          echo "TAG_SHA=$tag_sha" >> "$GITHUB_ENV"

      - name: Download and verify
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n strata-windows-x64 -D dist
          cd dist
          sha256sum -c SHA256SUMS
          ls -l

      - name: Release
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$REPO" --verify-tag --prerelease --title "$TAG" \
            --notes "Windows x64 CUDA engine + CPU image encoder built by build-windows-cuda run $RUN_ID from $TAG_SHA. SHA-256 in SHA256SUMS." \
            dist/strata-windows-x64.zip dist/SHA256SUMS
